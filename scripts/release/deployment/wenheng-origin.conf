server {
    listen 443 ssl;
    server_name wenheng-origin.internal;
    ssl_certificate /opt/wenheng/ssl/origin.crt;
    ssl_certificate_key /opt/wenheng/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 101.37.21.147;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 30m;
    location ^~ /wenheng/api/ {
        proxy_pass http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header Host qisw.top;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location / { return 404; }
}
